<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCP Kubernetes To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background-color: #f8f9fa; }
        form { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 10px; font-size: 16px; border: 1px solid #ced4da; border-radius: 4px 0 0 4px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #1a73e8; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 12px; background: white; border: 1px solid #dee2e6; margin-bottom: 5px; border-radius: 4px; }
        .delete-btn { color: #d93025; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Cloud-Native To-Do List (GKE)</h2>
    <form action="/add" method="POST">
        <input type="text" name="todo" placeholder="Add a new cloud milestone..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for todo in todos %}
        <li>
            {{ todo }}
            <a href="/delete/{{ loop.index0 }}" class="delete-btn">✖</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
